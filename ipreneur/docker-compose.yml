version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ipreneur_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipreneur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipreneur_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ipreneur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipreneur"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ipreneur_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ipreneur_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: ipreneur_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ipreneur:ipreneur_dev@postgres:5432/ipreneur
      REDIS_URL: redis://:redis_dev@redis:6379/0
      CELERY_BROKER_URL: redis://:redis_dev@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_dev@redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      PLAYWRIGHT_BROWSERS_PATH: /home/appuser/.cache/ms-playwright
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: ipreneur_worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ipreneur:ipreneur_dev@postgres:5432/ipreneur
      REDIS_URL: redis://:redis_dev@redis:6379/0
      CELERY_BROKER_URL: redis://:redis_dev@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_dev@redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      PLAYWRIGHT_BROWSERS_PATH: /home/appuser/.cache/ms-playwright
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Celery Beat (Scheduler) ─────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: ipreneur_beat
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ipreneur:ipreneur_dev@postgres:5432/ipreneur
      REDIS_URL: redis://:redis_dev@redis:6379/0
      CELERY_BROKER_URL: redis://:redis_dev@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_dev@redis:6379/2
      PLAYWRIGHT_BROWSERS_PATH: /home/appuser/.cache/ms-playwright
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
      target: development
    container_name: ipreneur_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: ipreneur_network
